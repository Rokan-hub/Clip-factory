name: Make clips

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Video link (direct .mp4 link or Google Drive share link). Leave empty if you uploaded a file to input/"
        required: false
        default: ""
      source_file:
        description: "File name inside the input/ folder (e.g. game.mp4). Used only if the link is empty"
        required: false
        default: ""
      channel:
        description: "Which channel the clips are for"
        type: choice
        options: [channel1, channel2, channel3]
        default: channel1
      template:
        description: "Editing template (auto = AI picks the best one for each clip)"
        type: choice
        options: [auto, gta_moment, gta_react, gta_list, gta_chase, gta_heist, gta_fail, gta_cinematic, stream_clutch, stream_funny, video_story, video_talk]
        default: auto
      count:
        description: "How many reels from this video"
        type: choice
        options: ["5", "6", "7"]
        default: "5"
      required_text:
        description: "Campaign text for descriptions, e.g. @brand #ad (optional)"
        required: false
        default: ""

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter
          sudo mkdir -p /usr/share/fonts/truetype/poppins
          for w in Bold Black; do
            sudo curl -fsSL -o /usr/share/fonts/truetype/poppins/Poppins-$w.ttf \
              https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf || true
          done
          sudo fc-cache -f

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Get the source video
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          mkdir -p input
          if [ -n "$SOURCE_URL" ]; then
            if echo "$SOURCE_URL" | grep -Eq "youtube\.com|youtu\.be"; then
              echo "YouTube link - trying yt-dlp (YouTube often blocks GitHub servers)"
              pip install -q --break-system-packages yt-dlp 2>/dev/null || pip install -q yt-dlp
              yt-dlp -f "bv*[height<=1080]+ba/b" --merge-output-format mp4 -o input/source.mp4 "$SOURCE_URL" || true
            elif echo "$SOURCE_URL" | grep -q "drive.google.com"; then
              gdown --fuzzy "$SOURCE_URL" -O input/source.mp4 || true
            else
              curl -fL --retry 3 -o input/source.mp4 "$SOURCE_URL" || true
            fi
            echo "SRC=input/source.mp4" >> $GITHUB_ENV
          elif [ -n "$SOURCE_FILE" ]; then
            echo "SRC=input/$SOURCE_FILE" >> $GITHUB_ENV
            echo "$SOURCE_FILE" > /tmp/srcname
          else
            echo "::error::Give either a video link or a file name in input/"; exit 1
          fi

      - name: Check the video is real
        run: |
          F="${SRC}"
          if [ ! -s "$F" ] || ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$F" | grep -q video; then
            echo "::error::The link did not give a real video file. YouTube blocks GitHub servers, so download the video yourself, upload it to Google Drive (Share > Anyone with the link) and paste that link. A direct .mp4 link also works."
            exit 1
          fi
          echo "Video OK: $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F") seconds"

      - name: Make the clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python clipkit/run_pipeline.py \
            --source "$SRC" \
            --channel "${{ inputs.channel }}" \
            --template "${{ inputs.template }}" \
            --count "${{ inputs.count }}" \
            --required "${{ inputs.required_text }}" \
            --out out

      - name: Show summary
        if: always()
        run: |
          echo "### Clips" >> $GITHUB_STEP_SUMMARY
          if [ -f out/moments.json ]; then python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          for m in json.load(open("out/moments.json")):
              print(f"- **{m['name']}** `{m.get('template','')}` ({m['start']}s to {m['end']}s) score {m['score']}: {m['hook']} - {m['reason']}")
          EOF
          fi
          if [ -f out/ai_usage.json ]; then python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json, collections
          rows = json.load(open("out/ai_usage.json"))
          print("\n### Who did the work")
          c = collections.Counter((r["job"], r["provider"], "done" if r["ok"] else "failed") for r in rows)
          for (job, p, st), n in sorted(c.items()):
              print(f"- {job}: **{p}** {st} x{n}")
          EOF
          fi

      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ inputs.channel }}
          path: |
            out/clips/*.mp4
            out/titles_*.csv
            out/moments.json
            out/ai_usage.json
          retention-days: 7
